<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 560" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4a5a6e"/></marker>
    <style>
      .box{fill:#fff;stroke:#b9c4d0;stroke-width:1.2;rx:10}
      .aws{fill:#fff7ec;stroke:#e59b2b}
      .ml{fill:#eef5ff;stroke:#2f6fb3}
      .t{font-weight:700;fill:#1b2430}
      .s{fill:#5d6b7c;font-size:11.5px}
      .ln{stroke:#4a5a6e;stroke-width:1.4;fill:none;stroke-linejoin:round;marker-end:url(#a)}
      .dash{stroke-dasharray:5 4}
      .grp{fill:none;stroke:#8fa0b3;stroke-dasharray:6 5;rx:14}
      .gl{fill:#5d6b7c;font-size:12px;font-weight:700;letter-spacing:.5px}
    </style>
  </defs>
  <rect width="1100" height="560" fill="#f7f9fb"/>
  <text x="24" y="34" font-size="18" font-weight="700" fill="#1f3a5f">Claims Triage Assistant – POC architecture</text>

  <!-- clients -->
  <rect class="box" x="24" y="80" width="170" height="64"/><text class="t" x="40" y="106">Web console</text><text class="s" x="40" y="126">CloudFront + S3 (static)</text>
  <rect class="box" x="24" y="170" width="170" height="64"/><text class="t" x="40" y="196">Core / legacy systems</text><text class="s" x="40" y="216">REST + JSON, API key</text>
  <rect class="box" x="24" y="260" width="170" height="64"/><text class="t" x="40" y="286">FNOL PDF / fax scan</text><text class="s" x="40" y="306">pre-signed S3 upload</text>

  <rect class="grp" x="220" y="56" width="856" height="480"/><text class="gl" x="236" y="76">AWS ACCOUNT</text>

  <rect class="box aws" x="250" y="160" width="160" height="84"/><text class="t" x="266" y="188">API Gateway</text><text class="s" x="266" y="208">REST · API key</text><text class="s" x="266" y="224">usage plan + throttling</text>
  <rect class="box aws" x="460" y="160" width="170" height="84"/><text class="t" x="476" y="188">Lambda orchestrator</text><text class="s" x="476" y="208">FNOL → features</text><text class="s" x="476" y="224">chains 3 models + rules</text>

  <rect class="box aws" x="460" y="300" width="170" height="60"/><text class="t" x="476" y="325">S3 · documents</text><text class="s" x="476" y="344">uploads, 30-day expiry</text>
  <rect class="box aws" x="250" y="300" width="160" height="60"/><text class="t" x="266" y="325">Amazon Textract</text><text class="s" x="266" y="344">OCR of FNOL forms</text>
  <rect class="box aws" x="460" y="400" width="170" height="60"/><text class="t" x="476" y="425">DynamoDB</text><text class="s" x="476" y="444">decision + model audit trail</text>
  <rect class="box aws" x="250" y="400" width="160" height="60"/><text class="t" x="266" y="425">EventBridge</text><text class="s" x="266" y="444">5-min keep-warm ping</text>

  <!-- SageMaker group -->
  <rect class="grp" x="680" y="96" width="376" height="300" style="stroke:#2f6fb3"/><text class="gl" x="696" y="116" fill="#2f6fb3">AMAZON SAGEMAKER · serverless inference</text>
  <rect class="box ml" x="700" y="132" width="336" height="64"/><text class="t" x="716" y="156">① Narrative model  (runs first)</text><text class="s" x="716" y="176">TF-IDF + logistic reg. → loss type + injury / attorney / TL flags</text>
  <rect class="box ml" x="700" y="214" width="336" height="64"/><text class="t" x="716" y="238">② Fraud risk model</text><text class="s" x="716" y="258">gradient-boosted trees → score + top risk factors</text>
  <rect class="box ml" x="700" y="296" width="336" height="64"/><text class="t" x="716" y="320">③ Severity model</text><text class="s" x="716" y="340">GBM + quantiles → expected cost, P10–P90, reserve</text>

  <rect class="box" x="700" y="430" width="336" height="80" style="fill:#f1f4f8"/><text class="t" x="716" y="454">Training (offline)</text><text class="s" x="716" y="474">SageMaker training jobs · managed scikit-learn container</text><text class="s" x="716" y="492">5,000 synthetic claims in S3 → model.tar.gz artifacts</text>

  <!-- arrows (straight, right-angled) -->
  <path class="ln" d="M194,112 H236 V180 H250"/>
  <path class="ln" d="M194,202 H250"/>
  <path class="ln" d="M194,280 H480 V300"/>
  <path class="ln" d="M410,202 H460"/>
  <path class="ln" d="M630,202 H665 V164 H700"/>
  <path class="ln" d="M630,202 H665 V246 H700"/>
  <path class="ln" d="M630,202 H665 V328 H700"/>
  <path class="ln" d="M545,244 V300"/>
  <path class="ln" d="M460,330 H410"/>
  <path class="ln" d="M630,232 H650 V430 H630"/>
  <path class="ln dash" d="M410,430 H435 V232 H460"/>
  <path class="ln dash" d="M868,430 V362"/>
  <text class="s" x="872" y="410">deploys artifacts</text>
</svg>
