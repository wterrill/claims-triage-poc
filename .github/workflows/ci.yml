name: ci
on:
  push:
  pull_request:
jobs:
  local-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: Train the 3 models
        run: for m in fraud severity notes; do python ml/src/${m}_model.py --model-dir build/model/$m; done
      - name: End-to-end harness (expects 34/34 routing matches)
        run: python tests/local_harness.py | tee harness.txt && grep -q "on 34/34 runs" harness.txt
  sklearn-1-2-container-compat:
    # The SageMaker serving image pins scikit-learn 1.2.1 / pandas 1.1.3 / Python 3.9
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"
      - run: pip install scikit-learn==1.2.1 numpy==1.24.1 pandas==1.1.3 scipy==1.8.0 joblib pypdf reportlab pillow boto3
      - run: for m in fraud severity notes; do python ml/src/${m}_model.py --model-dir build/model/$m; done
      - run: python tests/local_harness.py | tee harness.txt && grep -q "on 34/34 runs" harness.txt
  cdk-synth:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install -g aws-cdk@2 && pip install -r infra/requirements.txt
      - name: Synth both stacks (placeholder model artifacts)
        env:
          CDK_DEFAULT_ACCOUNT: "123456789012"
          CDK_DEFAULT_REGION: us-east-2
          CDK_DISABLE_CLI_TELEMETRY: "true"
        run: |
          mkdir -p build
          python - <<'EOF'
          import json
          img = "257758044811.dkr.ecr.us-east-2.amazonaws.com/sagemaker-scikit-learn:1.2-1-cpu-py3"
          m = {n: {"job": "ci", "model_data": f"s3://placeholder/{n}/model.tar.gz",
                   "entry_point": f"{n}_model.py", "image": img, "metrics": {}} for n in ("fraud", "severity", "notes")}
          json.dump({"region": "us-east-2", "run_id": "ci", "models": m}, open("build/model_artifacts.json", "w"))
          EOF
          cd infra && cdk synth --quiet
